name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper (if present)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.0
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          cache-key: gradle-home-v1-${{ runner.os }}-java${{ matrix.java }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle/libs.versions.toml', 'gradle.properties', '.tool-versions', 'mods/**/build.gradle.kts') }}
          cache-restore-keys: |
            gradle-home-v1-${{ runner.os }}-java${{ matrix.java }}-
          gradle-home-cache-includes: caches wrapper

      - name: Assemble
        run: gradle assemble

      - name: Tests
        run: gradle test

      - name: Static analysis (Spotless, Checkstyle, SpotBugs)
        run: |
          gradle spotlessCheck \
                 checkstyleMain checkstyleTest \
                 spotbugsMain spotbugsTest

      - name: Upload SpotBugs SARIF to GitHub
        if: ${{ always() && hashFiles('build/reports/spotbugs/**/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/spotbugs

      - name: Markdown formatting (Prettier)
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - run: npx -y prettier@3.2.5 --check "**/*.md"

      - name: Remap jars
        run: gradle remapJar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars-java-${{ matrix.java }}
          path: |
            mods/*/build/libs/*.jar
          if-no-files-found: warn
