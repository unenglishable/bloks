name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper (if present)
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') != '' }}
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build (Gradle 9.3.0)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.0
          arguments: build

      - name: Static analysis (Spotless, Checkstyle, SpotBugs)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.0
          arguments: |
            spotlessCheck
            checkstyleMain checkstyleTest
            spotbugsMain spotbugsTest

      - name: Markdown formatting (Prettier)
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - run: npx -y prettier@3.2.5 --check "**/*.md"

      - name: Remap jars
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2
          arguments: remapJar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars-java-${{ matrix.java }}
          path: |
            mods/*/build/libs/*.jar
          if-no-files-found: warn
