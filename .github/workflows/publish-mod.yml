name: Publish Mod (Semantic Release)

on:
  workflow_dispatch:
    inputs:
      modid:
        description: Mod ID under mods/<modid>
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODID: ${{ inputs.modid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run semantic-release for module
        working-directory: mods/${{ env.MODID }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -y \
            semantic-release \
            -p @semantic-release/commit-analyzer \
               @semantic-release/release-notes-generator \
               @semantic-release/changelog \
               @semantic-release/git \
               @semantic-release/github \
               @semantic-release/exec

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(sed -n 's/^version=//p' mods/${MODID}/gradle.properties)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build and remap
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.10.2
          arguments: |
            :mods:${{ env.MODID }}:build
            :mods:${{ env.MODID }}:remapJar

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.MODID }}-v${{ steps.version.outputs.version }}
          files: |
            mods/${{ env.MODID }}/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth/CurseForge (optional)
        if: ${{ (secrets.MODRINTH_TOKEN != '' && vars.MODRINTH_PROJECT_ID != '') || (secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != '') }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: mods/${{ env.MODID }}/build/libs/*.jar
          name: Beautiful Day Counter ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          changelog: mods/${{ env.MODID }}/CHANGELOG.md
          fail-mode: warn

