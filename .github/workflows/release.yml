name: Release Mod

on:
  push:
    tags:
      - "*-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag for modid and version
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          MODID="${TAG%%-v*}"
          VERSION="${TAG#*-v}"
          echo "modid=${MODID}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build module
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.0
          arguments: |
            :mods:${{ steps.parse.outputs.modid }}:build
            :mods:${{ steps.parse.outputs.modid }}:remapJar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.parse.outputs.modid }} ${{ steps.parse.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            Release for `${{ steps.parse.outputs.modid }}` version `${{ steps.parse.outputs.version }}`.
            Built with Java 17 and Loom. Includes remapped JAR(s).
          files: |
            mods/${{ steps.parse.outputs.modid }}/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
