name: CD Publish

on:
  push:
    branches: ["cd"]

jobs:
  publish-curseforge:
    runs-on: ubuntu-latest
    if: ${{ secrets.CURSEFORGE_TOKEN != '' && vars.CURSEFORGE_PROJECT_ID != '' }}
    env:
      MODID: beautiful_day_counter
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.0
          gradle-home-cache-includes: caches wrapper

      - name: Build and remap jar
        run: gradle :mods:${MODID}:build :mods:${MODID}:remapJar

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: mods/${{ env.MODID }}/build/libs/${{ env.MODID }}-*.jar
          name: Beautiful Day Counter (cd build)
          version: cd-${{ github.run_id }}
          version-type: beta
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          changelog: mods/${{ env.MODID }}/CHANGELOG.md
          fail-mode: warn
