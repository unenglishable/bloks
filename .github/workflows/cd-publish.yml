name: CD Publish

on:
  push:
    branches: ["cd"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODID: beautiful_day_counter
    outputs:
      version: ${{ steps.capture_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.0
          gradle-home-cache-includes: caches wrapper

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      - name: Run semantic-release
        working-directory: mods/${{ env.MODID }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -y \
            -p semantic-release@24.2.9 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/changelog \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            semantic-release
      - name: Capture version
        id: capture_version
        run: |
          VERSION=$(sed -n 's/^version=//p' mods/${MODID}/gradle.properties)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODID: beautiful_day_counter
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.0
          gradle-home-cache-includes: caches wrapper

      - name: Build and remap
        run: gradle :mods:${MODID}:build :mods:${MODID}:remapJar

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: mods/${{ env.MODID }}/build/libs/${{ env.MODID }}-${{ needs.release.outputs.version }}-remapped.jar
          name: Beautiful Day Counter ${{ needs.release.outputs.version }}
          version: ${{ needs.release.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          changelog: mods/${{ env.MODID }}/CHANGELOG.md
          fail-mode: warn

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: mods/${{ env.MODID }}/build/libs/${{ env.MODID }}-${{ needs.release.outputs.version }}-remapped.jar
          name: Beautiful Day Counter ${{ needs.release.outputs.version }}
          version: ${{ needs.release.outputs.version }}
          version-type: release
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          changelog: mods/${{ env.MODID }}/CHANGELOG.md
          fail-mode: warn
