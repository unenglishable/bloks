name: CD Publish

on:
  push:
    branches: ["cd"]

jobs:
  publish-curseforge:
    runs-on: ubuntu-latest
    env:
      MODID: beautiful_day_counter
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.0
          gradle-home-cache-includes: caches wrapper

      - name: Determine version
        id: meta
        run: |
          VERSION=$(sed -n 's/^version=//p' mods/${MODID}/gradle.properties)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and remap jar
        run: gradle :mods:${MODID}:build :mods:${MODID}:remapJar

      - name: Debug jars
        run: ls -R mods/${MODID}/build/libs

      - name: Prepare jar
        run: |
          mkdir -p mods/${MODID}/dist
          cp mods/${MODID}/build/libs/${MODID}-${{ steps.meta.outputs.version }}.jar mods/${MODID}/dist/${MODID}-cd-${{ github.run_id }}.jar

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: mods/${{ env.MODID }}/dist/${{ env.MODID }}-cd-${{ github.run_id }}.jar
          name: Beautiful Day Counter (cd build)
          version: cd-${{ github.run_id }}
          version-type: beta
          loaders: fabric
          game-versions: 1.21.11
          java: 21
          changelog: mods/${{ env.MODID }}/CHANGELOG.md
          fail-mode: warn
